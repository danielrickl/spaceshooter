<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Space Shooter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-wrapper">
    <canvas id="game" width="800" height="600"></canvas>

    <div id="hud">
      <div id="score-box">
        <div id="score">Skóre: 0</div>
        <div id="highscore">Rekord: 0</div>
      </div>
      <div id="effects"></div>
      <div id="lives"></div>
    </div>

    <div id="start-screen" class="overlay">
      <h1>SPACE SHOOTER</h1>
      <p>Sestřel co nejvíc meteoritů!</p>
      <p class="bonus-info">Zlaté meteority dávají odměnu:<br>
        +50 bodů · extra život · štít · trojitá střela</p>
      <p>Rekord: <span id="start-highscore">0</span></p>
      <ul class="controls">
        <li><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> pohyb</li>
        <li><kbd>Mezerník</kbd> střelba</li>
      </ul>
      <button id="start-btn">Start</button>
      <p class="hint">nebo stiskni Enter</p>
    </div>

    <div id="gameover-screen" class="overlay hidden">
      <h1>GAME OVER</h1>
      <p id="new-record" class="hidden">🏆 NOVÝ REKORD! 🏆</p>
      <p>Tvoje skóre: <span id="final-score">0</span></p>
      <p>Rekord: <span id="final-highscore">0</span></p>
      <button id="restart-btn">Hrát znovu</button>
      <p class="hint">nebo stiskni Enter</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/input.js"></script>
  <script src="js/player.js"></script>
  <script src="js/bullet.js"></script>
  <script src="js/meteor.js"></script>
  <script src="js/collision.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
